name: Crash report
description: Git Tree crashed, froze or closed unexpectedly. The app's "Report on GitHub" button opens this form.
title: "[Crash]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a crash. Git Tree never sends anything on its own: this form was opened by you, and you decide what to post.
        In the crash window (or **Help › Crash Reports…** for a crash from an earlier session) choose **Report on GitHub**. The app shows you the report first: copy the full report, or only a short summary, then paste it below. Nothing is copied or sent until you choose.
        **Read the report before you post it.** It is redacted, but remove anything private, such as folder names, repository names or e-mail addresses. Never paste tokens or passwords.
  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing?
      description: What did you click or type just before the crash, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report
      description: Paste the report text here.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Git Tree version
      description: Shown at the bottom-right of the window and in the crash report.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux (Ubuntu or Debian)
        - Linux (other)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      description: Filled in by the app when it can read it; otherwise type it.
      placeholder: macOS 15.3 / Windows 11 24H2 / Ubuntu 24.04
  - type: input
    id: git-version
    attributes:
      label: Git version
      description: The output of `git --version`.
      placeholder: git version 2.47.1
  - type: input
    id: crash-id
    attributes:
      label: Crash report id
      description: Filled in by the app. It names the saved file, for example `crash-1790690000.txt`.
      placeholder: crash-1790690000

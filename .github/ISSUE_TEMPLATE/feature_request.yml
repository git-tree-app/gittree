name: Feature request
description: Suggest an idea or an improvement for Git Tree.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search [open requests](https://github.com/git-tree-app/gittree/issues?q=is%3Aissue+label%3Aenhancement) first: a 👍 on an existing one counts. Bigger ideas others can vote on fit in [Discussions › Ideas](https://github.com/git-tree-app/gittree/discussions/categories/ideas).
        Everything here is public: leave out tokens, passwords and private repository details.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the workflow or situation where Git Tree falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other tools, Git commands or workarounds you use today.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
  - type: input
    id: version
    attributes:
      label: Git Tree version
      description: Shown at the bottom right of the window.
      placeholder: 3.0.1
